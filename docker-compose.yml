services:
  api-gateway:
    build: ./services/api_gateway
    container_name: api_gateway
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - backend
    depends_on:
      - server-manager

  server-manager:
    build: ./services/server_manager
    container_name: server_manager
    ports:
      - "8081:8081"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - processing-server-1
#      - processing-server-2
#      - processing-server-3
#      - processing-server-4

  change-handler:
    build: ./services/change_handler
    container_name: change_handler
    ports:
      - "8082:8082"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - backend

  processing-server-1:
    build: ./services/processing_server
    container_name: processing_server_1
    environment:
      - PORT=8101
    ports:
      - "8101:8101"
    networks:
      - backend

